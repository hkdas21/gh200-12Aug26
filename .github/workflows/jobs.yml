name: jobs

on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🖥️ Run Greeting Script
        run: |
          chmod +x scripts/greet.sh
          ./scripts/greet.sh

  build:
    runs-on: ubuntu-latest
    needs: setup                    # ← Runs AFTER setup
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔨 Simulate Build
        run: |
          mkdir -p build-output
          echo "Building the application..."
          echo "Build completed at $(date)" > build-output/build-report.txt
          echo "Commit: $GITHUB_SHA" >> build-output/build-report.txt
          echo "Branch: $GITHUB_REF_NAME" >> build-output/build-report.txt
      - name: upload artifcat
        uses: actions/upload-artifact@v5
        with:
          name: build-report
          path: build-output/
          retention-days: 5

          
  test:
    runs-on: ubuntu-latest
    needs: build                    # ← Runs AFTER build
    steps:
      - name: 🧪 Simulate Tests
        run: |
          echo "Running tests..."
          echo "✅ All tests passed!"

      - name: download
        uses: actions/download-artifact@v5
        with:
          name: build-report

      - name: Inspect
        run: |
          cat build-report.txt
