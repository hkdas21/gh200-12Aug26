name: timeout

on: push

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10              # Job timeout
    steps:
      - name: ⏱️ Step with Timeout
        timeout-minutes: 1           # Step timeout
        run: |
          echo "This step must complete in 1 minute"

  test:
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          - os: windows-latest        # Skip this combo
            python-version: '3.10'
        include:
          - os: ubuntu-latest         # Add extra config
            python-version: '3.12'
            experimental: true
      fail-fast: false               # Don't cancel others if one fails
    steps:
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 🧪 Run Tests
        run: |
          echo "Testing on ${{ matrix.os }} with Python ${{ matrix.python-version }}"
          python --version
